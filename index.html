<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Crédito</title>
    <link rel="stylesheet" href="simulador.css">
    <script src="funciones.js"></script>
    <script src="simulador.js"></script>
</head>
<body>

    <div class="container">
        <img src="B05EBA6C-838D-4498-B721-CAD753E911EB.PNG" alt="Logo GITcash" class="logo">
    <h1>IN NOVA</h1>
    <p class="autor">Creado por: Daniel Orrala</p>

        <h2>Datos financieros</h2>

<label for="txtIngresos">Ingresos:</label>
<input type="text" id="txtIngresos" onblur="validarIngresos()">
<span id="errorIngresos" class="mensaje-error"></span>

<label for="txtEgresos">Egresos:</label>
<input type="text" id="txtEgresos" onblur="validarEgresos()">
<span id="errorEgresos" class="mensaje-error"></span>

<p>Disponible: <span id="spnDisponible"></span></p>
<p>Capacidad de pago mensual: <span id="spnCapacidadPago"></span></p>


<h2>Solicitud de crédito</h2>

<label for="txtMonto">Monto:</label>
<input type="text" id="txtMonto" onblur="validarMonto()">
<span id="errorMonto" class="mensaje-error"></span>

<label for="txtPlazo">Plazo en años:</label>
<input type="text" id="txtPlazo" onblur="validarPlazo()">
<span id="errorPlazo" class="mensaje-error"></span>

<label for="txtTasaInteres">Tasa de interés:</label>
<input type="text" id="txtTasaInteres" onblur="validarTasaInteres()">
<span id="errorTasaInteres" class="mensaje-error"></span>

        <p>Interés a pagar: <span id="spnInteresPagar"></span></p>
        <p>Total préstamo: <span id="spnTotalPrestamo"></span></p>
        <p>Cuota mensual: <span id="spnCuotaMensual"></span></p>
        <p>Estado de crédito: <span id="spnEstadoCredito">ANALIZANDO...</span></p>

        <div class="buttons">
            <button onclick="calcular()" id="btnCalcularCredito">Calcular Crédito</button>
            <button id="btnReiniciar">Reiniciar</button>
        </div>
    </div>

</body>
</html>
